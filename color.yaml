# yaml-language-server: $schema=./color.schema.json

# ------------------------------------------------------------------
# Two layers, one hop. The palette holds every hex; every other token
# points at a palette entry and never at another semantic token.
#
# Role groups stay independent even where they land on the same value
# today. `ansi.red` and `state.error` both resolve to red-900 right
# now, but one is a contract with every program the user runs and the
# other is a styling choice — chaining them would make a UI decision
# silently rewrite the terminal.
#
# The scale number is a lightness and nothing else. `red-900` and
# `green-900` are the same weight, so a role can move between families
# without moving up or down, and a light theme can fill the same
# numbers with its own values and leave every token below untouched.
#
# stone is where the ladder is written down. Every chromatic family
# stands on stone's rungs, which is why the numbers are not evenly
# spaced and should not be: the spacing is tight near the ground where
# the surfaces stack, tight again through the text weights, and wide
# across the middle this theme barely uses. `build/ramp.ts` derives
# every chromatic value from the rung and the family, and
# `build/ramp.test.ts` checks that the file still says so.
#
# The ramps are complete rather than sparse. About half the rungs have
# no role pointing at them, which the build reports as a count rather
# than an error: a role that wants a weight should find it already
# there instead of needing a palette edit first.
#
# Every token writes both modes. Most of the semantic layer names the
# same entry twice, because which entry a role points at is a decision
# that holds in both themes — but writing it once and letting the other
# mode inherit made the file readable only to someone who knew the rule,
# and made a forgotten mode indistinguishable from a deliberate one. The
# schema turns the omission into an error, so a role that wants a
# different entry under one theme is the only thing a difference means.
#
# A `/xx` suffix on a reference applies alpha, hex pair, same notation
# the VS Code theme uses. Tools that cannot express alpha flatten it
# against the ground they declare.
# ------------------------------------------------------------------

# stone — the warm neutral ramp, and the ladder every other family stands on.
# Hue holds at 43-68 the whole way up in both themes, and both run in the same
# direction: away from their own ground, one lightening and one darkening.
#
# The two ends belong to stone alone. `00` is the ground the theme is drawn on,
# and `1000` is the far extreme the strongest foreground reaches for; a family
# at the ground would be the ground, and one at the extreme has no chroma left
# to carry.
$color.palette.stone-00:
  values:
    theme-dark: "#181513"
    theme-light: "#e9e6e3"
$color.palette.stone-100:
  values:
    theme-dark: "#1d1917"
    theme-light: "#e1dcd9"
$color.palette.stone-200:
  values:
    theme-dark: "#25201d"
    theme-light: "#dbd5d1"
$color.palette.stone-300:
  values:
    theme-dark: "#302a26"
    theme-light: "#d3cbc6"
$color.palette.stone-400:
  values:
    theme-dark: "#49403b"
    theme-light: "#bbb1ab"
$color.palette.stone-500:
  values:
    theme-dark: "#6c5e56"
    theme-light: "#a2938a"
$color.palette.stone-600:
  values:
    theme-dark: "#918076"
    theme-light: "#89786e"
$color.palette.stone-700:
  values:
    theme-dark: "#a2938a"
    theme-light: "#71635b"
$color.palette.stone-800:
  values:
    theme-dark: "#a99b93"
    theme-light: "#5a4e47"
$color.palette.stone-900:
  values:
    theme-dark: "#c2bdba"
    theme-light: "#413c3a"
$color.palette.stone-950:
  description: >-
    Halves the widest step in the ramp, which is also the one carrying the most
    weight: nearly half of every colour a target asks for resolves to 900 or
    1000, and there was nothing between them.
  values:
    theme-dark: "#d4d1cf"
    theme-light: "#2d2a28"
$color.palette.stone-1000:
  values:
    theme-dark: "#e7e5e4"
    theme-light: "#1b1918"

# pure — chroma zero, deliberately off the stone ramp, and the one family
# that does not move between themes. ANSI black and white are a
# cross-terminal contract: a program that asks for black means black, on
# whichever ground the terminal happens to be drawing. So the four hold
# one value each, and the cost is symmetric — black is nearly invisible
# on the dark theme exactly as white is on the light one, which is what
# every terminal has always done.
$color.palette.pure-black:
  values:
    theme-dark: "#000000"
    theme-light: "#000000"
$color.palette.pure-dim:
  values:
    theme-dark: "#4a4a4a"
    theme-light: "#4a4a4a"
$color.palette.pure-light:
  values:
    theme-dark: "#d9d9d9"
    theme-light: "#d9d9d9"
$color.palette.pure-white:
  values:
    theme-dark: "#ffffff"
    theme-light: "#ffffff"

# ink and paper — chroma zero like `pure`, and ordinal where `pure` is
# literal. `paper` is the ground's own extreme and `ink` the far one: a
# dark theme lifts an element off its ground with white and sinks it with
# black, a light theme does the reverse, and every token below keeps
# working. `pure` cannot carry this because ANSI black has to stay black
# in both.
$color.palette.ink:
  values:
    theme-dark: "#ffffff"
    theme-light: "#000000"
$color.palette.paper:
  values:
    theme-dark: "#000000"
    theme-light: "#ffffff"
$color.palette.ink-faint:
  description: >-
    Ink laid down so thinly it barely takes: a dark grey on a dark ground,
    a light one on a light ground. Reads as the same gesture in both, which
    pure-dim cannot do while it is also answering to ANSI bright black.
  values:
    theme-dark: "#4a4a4a"
    theme-light: "#adadad"

# ------------------------------------------------------------------
# The chromatic families. Nine hues, ten rungs each, all of it derived:
# the rung fixes the lightness, the family fixes the hue and the chroma,
# and `build/ramp.ts` holds the two numbers per family that decide the
# rest. Editing a hex here without editing that file is a test failure,
# which is the point — the values are an output, not a decision.
#
# A ramp rises, plateaus, then falls away again. The plateau is the
# family's chroma; the ends are the sRGB cube closing in, where no value
# that saturated exists at that lightness.
# ------------------------------------------------------------------

# red — the warmest of the cool half, and the only family whose chroma runs
# above the rest. Failure, deletion and markup all live here.
$color.palette.red-100:
