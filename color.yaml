    theme-dark: $color.palette.green-800
    theme-light: $color.palette.green-800
$color.state.added:
  values:
    theme-dark: $color.palette.green-800
    theme-light: $color.palette.green-800
$color.state.modified:
  description: >-
    Every surface that marks an edit — gutter, git decoration, tab
